openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries and activity
  - name: policies
    description: Government policy repository
  - name: schemes
    description: Public welfare schemes
  - name: eligibility
    description: Eligibility matching
  - name: notifications
    description: User notifications
  - name: feedback
    description: Feedback and support
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /policies:
    get:
      operationId: listPolicies
      tags: [policies]
      summary: Search policies
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matching policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"
    post:
      operationId: createPolicy
      tags: [policies]
      summary: Create a policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyInput"
      responses:
        "201":
          description: Created policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
  /policies/{id}:
    get:
      operationId: getPolicy
      tags: [policies]
      summary: Get a policy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Policy detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Policy not found
    patch:
      operationId: updatePolicy
      tags: [policies]
      summary: Update policy status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpdate"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
  /schemes:
    get:
      operationId: listSchemes
      tags: [schemes]
      summary: Search public schemes
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matching schemes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scheme"
  /schemes/{id}:
    get:
      operationId: getScheme
      tags: [schemes]
      summary: Get a scheme
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Scheme detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scheme"
        "404":
          description: Scheme not found
  /eligibility/check:
    post:
      operationId: checkEligibility
      tags: [eligibility]
      summary: Match a citizen profile to schemes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityInput"
      responses:
        "200":
          description: Eligibility results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityResult"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Policy:
      type: object
      required: [id, title, category, ministry, state, status, publishedDate, summary, tags]
      properties:
        id: { type: integer }
        title: { type: string }
        category: { type: string }
        ministry: { type: string }
        state: { type: string }
        status: { type: string }
        publishedDate: { type: string }
        summary: { type: string }
        tags:
          type: array
          items: { type: string }
        impact: { type: string }
    PolicyInput:
      type: object
      required: [title, category, ministry, state, summary]
      properties:
        title: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        ministry: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        summary: { type: string, minLength: 1 }
        tags:
          type: array
          items: { type: string }
    PolicyUpdate:
      type: object
      properties:
        status: { type: string }
    Scheme:
      type: object
      required: [id, name, category, ministry, state, benefit, deadline, beneficiaries, eligibility, description, steps]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        ministry: { type: string }
        state: { type: string }
        benefit: { type: string }
        deadline: { type: string }
        beneficiaries: { type: string }
        eligibility:
          type: array
          items: { type: string }
        description: { type: string }
        steps:
          type: array
          items: { type: string }
    EligibilityInput:
      type: object
      required: [age, income, occupation, education, location, socialCategory, disability]
      properties:
        age: { type: integer, minimum: 0, maximum: 120 }
        income: { type: integer, minimum: 0 }
        occupation: { type: string }
        education: { type: string }
        location: { type: string }
        socialCategory: { type: string }
        disability: { type: boolean }
    EligibilityResult:
      type: object
      required: [matchCount, summary, recommended]
      properties:
        matchCount: { type: integer }
        summary: { type: string }
        recommended:
          type: array
          items:
            $ref: "#/components/schemas/Scheme"
    DashboardSummary:
      type: object
      required: [policyCount, schemeCount, activeAlerts, savedItems, trend, coverage]
      properties:
        policyCount: { type: integer }
        schemeCount: { type: integer }
        activeAlerts: { type: integer }
        savedItems: { type: integer }
        trend:
          type: array
          items:
            $ref: "#/components/schemas/TrendPoint"
        coverage:
          type: array
          items:
            $ref: "#/components/schemas/CoveragePoint"
    TrendPoint:
      type: object
      required: [label, policies, schemes]
      properties:
        label: { type: string }
        policies: { type: integer }
        schemes: { type: integer }
    CoveragePoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: integer }
    ActivityItem:
      type: object
      required: [id, title, description, time, type]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        time: { type: string }
        type: { type: string }
    Notification:
      type: object
      required: [id, title, message, time, read, type]
      properties:
        id: { type: integer }
        title: { type: string }
        message: { type: string }
        time: { type: string }
        read: { type: boolean }
        type: { type: string }
    FeedbackInput:
      type: object
      required: [subject, message, category]
      properties:
        subject: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
    Feedback:
      type: object
      required: [id, subject, message, category, status]
      properties:
        id: { type: integer }
        subject: { type: string }
        message: { type: string }
        category: { type: string }
        status: { type: string }

